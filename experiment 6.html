
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEasy Product</title>

<style>
    body {
        margin: 30px;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
    }

    .output-frame {
        max-width: 920px;
        margin: auto;
        background: #fff;
        border: 4px solid #2b2b2b;
    }

    .site-header {
        background: #111;
        color: #fff;
        text-align: center;
        padding: 18px;
        font-size: 26px;
        font-weight: 600;
    }

    .content-area {
        padding: 34px;
        display: flex;
        justify-content: center;
    }

    .product-card {
        width: 300px;
        border: 2px solid #dedede;
        background: #fafafa;
        border-radius: 6px;
        padding: 14px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    .img-wrap {
        width: 100%;
        height: 200px;
        overflow: hidden;
        border: 6px solid #efefef;
        margin-bottom: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .img-wrap img {
        width: 100%;
        height: auto;
    }

    .product-title {
        font-weight: 700;
        font-size: 16px;
        margin: 8px 0 6px;
    }

    .product-desc {
        font-size: 12px;
        color: #555;
        margin-bottom: 10px;
    }

    .price-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .current-price {
        color: #008d44;
        font-weight: bold;
        font-size: 16px;
    }

    .original-price {
        text-decoration: line-through;
        color: #888;
        font-size: 13px;
    }

    .add-btn {
        width: 100%;
        background: #006cdf;
        color: #fff;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
    }

    .footer-info {
        max-width: 920px;
        margin: 20px auto;
        padding: 15px;
        background: #fff;
        border: 3px solid #111;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="output-frame">
    <header class="site-header">ShopEasy</header>

    <div class="content-area">
        <div class="product-card">
            
            <div class="img-wrap">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs9d5-0oIW2LDPi6sBzJTAZTlfjIUbyS0gUg&s" alt="T-shirt">
            </div>

            <h2 class="product-title">Classic Cotton T-Shirt</h2>
            <p class="product-desc">Soft, breathable cotton. Regular fit. Available in multiple colors.</p>

            <div class="price-row">
                <span class="current-price">₹799</span>
                <span class="original-price">₹1,199</span>
            </div>

            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
</div>
<div class="footer-info">
    <p><b>Name :</b> KRISH</p>
    <p><b>Admission No :</b> 20225B02310062</p>
    <p><b>Class :</b> ELCE 1</p>
</div>
